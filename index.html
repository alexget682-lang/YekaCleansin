<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የካ ፅዳት | Official Pink V9.6 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --pink: #ff007f; --bg: #0d0006; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        .pink-neon { color: var(--pink); text-shadow: 0 0 10px var(--pink), 0 0 20px var(--pink); }
        .glass-pink { background: rgba(45, 0, 22, 0.85); border: 2px solid var(--pink); border-radius: 20px; box-shadow: 0 0 20px rgba(255, 0, 127, 0.2); }
        .btn-pink { background: var(--pink); color: #000; font-weight: 900; border-radius: 12px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-pink:active { transform: scale(0.95); }
        .input-pink { background: rgba(255, 0, 127, 0.05); border: 1px solid var(--pink); color: #fff; padding: 12px; border-radius: 10px; width: 100%; outline: none; }
        #reader { width: 100% !important; border: none !important; border-radius: 15px; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [view, setView] = useState('landing');
            const [complaints, setComplaints] = useState(() => JSON.parse(localStorage.getItem('yeka_v9_db')) || []);
            const [keys] = useState({ admin: '1111', creator: '2222' });
            const [ui, setUi] = useState({ scanning: false });

            useEffect(() => { localStorage.setItem('yeka_v9_db', JSON.stringify(complaints)); }, [complaints]);

            const startScan = () => {
                setUi({ scanning: true });
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                    () => { scanner.stop(); setUi({ scanning: false }); setView('citizen'); }, 
                    () => {}).catch(() => alert("ካሜራ መክፈት አልተቻለም"));
                }, 300);
            };

            const submitForm = (e) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target).entries());
                setComplaints([{ ...data, id: Date.now(), status: 'አዲስ', time: new Date().toLocaleString() }, ...complaints]);
                alert("ቅሬታዎ ተመዝግቧል!");
                setView('landing');
            };

            const downloadExcel = () => {
                const ws = XLSX.utils.json_to_sheet(complaints);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Reports");
                XLSX.writeFile(wb, "Yeka_Cleansing_Data.xlsx");
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    {/* Landing Page */}
                    {view === 'landing' && (
                        <div className="space-y-6 pt-10">
                            <h1 className="text-3xl font-black text-center pink-neon">የካ ፅዳት ማዕከል</h1>
                            
                            <div className="glass-pink p-6 text-center">
                                <p className="mb-4 text-[10px] font-black uppercase tracking-widest">ቅሬታ ለማቅረብ ስካን ያድርጉ</p>
                                <button onClick={startScan} className="btn-pink w-full py-5 uppercase font-black text-sm">QR ኮድ ስካነር</button>
                            </div>

                            <div className="flex gap-4">
                                <button onClick={() => setView('admin_login')} className="flex-1 bg-white/5 border border-pink-500 p-4 rounded-xl text-[10px] font-black uppercase">አስተዳደር</button>
                                <button onClick={() => setView('creator_login')} className="flex-1 bg-white/5 border border-pink-500 p-4 rounded-xl text-[10px] font-black uppercase">ፈጣሪ</button>
                            </div>

                            {ui.scanning && <div id="reader" className="mt-4"></div>}
                        </div>
                    )}

                    {/* Citizen Form */}
                    {view === 'citizen' && (
                        <form onSubmit={submitForm} className="glass-pink p-6 space-y-4">
                            <h2 className="text-xl font-black text-center pink-neon uppercase">አዲስ ቅሬታ</h2>
                            <input name="name" placeholder="ሙሉ ስም" required className="input-pink" />
                            <input name="phone" placeholder="ስልክ ቁጥር" required className="input-pink" />
                            <button type="submit" className="btn-pink w-full py-4 uppercase font-black">ሪፖርት ላክ</button>
                            <button onClick={() => setView('landing')} className="w-full text-[10px] opacity-40 uppercase">ተመለስ</button>
                        </form>
                    )}

                    {/* Admin & Creator Dashboards */}
                    {(view === 'admin_dashboard' || view === 'creator_dashboard') && (
                        <div className="space-y-4 pt-4">
                            <div className="flex justify-between items-center">
                                <h2 className="text-xl font-black text-center pink-neon uppercase">{view === 'admin_dashboard' ? 'አስተዳደር' : 'ፈጣሪ'}</h2>
                                <button onClick={downloadExcel} className="text-[9px] bg-green-600 px-2 py-1 rounded font-black">Excel</button>
                            </div>
                            {complaints.map(c => (
                                <div key={c.id} className="glass-pink p-4 flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-sm">{c.name}</p>
                                        <p className="text-[10px] text-pink-500">{c.status}</p>
                                    </div>
                                    {view === 'creator_dashboard' && (
                                        <button onClick={() => setComplaints(complaints.filter(i => i.id !== c.id))} className="text-red-500 text-xs font-black">አጥፋ</button>
                                    )}
                                </div>
                            ))}
                            <button onClick={() => setView('landing')} className="btn-pink w-full py-3 uppercase font-black">Logout</button>
                        </div>
                    )}

                    {/* Login Forms */}
                    {(view === 'admin_login' || view === 'creator_login') && (
                        <div className="glass-pink p-6 mt-10">
                            <input type="password" id="pass" placeholder="ኮድ ያስገቡ" className="input-pink mb-4 text-center font-black" />
                            <button onClick={() => {
                                const pass = document.getElementById('pass').value;
                                if(view === 'admin_login' && pass === keys.admin) setView('admin_dashboard');
                                else if(view === 'creator_login' && pass === keys.creator) setView('creator_dashboard');
                                else alert("የተሳሳተ ኮድ!");
                            }} className="btn-pink w-full py-4 uppercase font-black">ግባ</button>
                            <button onClick={() => setView('landing')} className="w-full mt-4 text-[10px] opacity-40 uppercase">ተመለስ</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
